name: Keep scheduled workflow activity

permissions:
  actions: write

on:
  schedule:
    - cron: '0 0 * * 0'   # 周日 UTC 0 点运行一次
  workflow_dispatch:       # 允许手动触发，方便测试

jobs:
  keep-scheduled-workflow-activity:
    runs-on: ubuntu-slim
    steps:
      - name: Keep scheduled workflow activity
        uses: WaterLemons2k/scheduled-workflow-activity-action@v2
